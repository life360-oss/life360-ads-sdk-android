apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "org.prebid.mobile.renderingtestapp"
    setCompileSdkVersion(34)
    setBuildToolsVersion("35.0.1")
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        applicationId "org.prebid.mobile.renderingtestapp"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/annotation-experimental_release.kotlin_module'
        exclude 'LICENSE.txt'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    adbOptions {
        timeOutInMs 5 * 60 * 1000 // 5 minutes
    }
    testOptions {
        animationsDisabled = true
    }
    buildFeatures {
        dataBinding true
    }
}

// TEMP - Pin Kotlin to 1.8.0 due to AppHarbr constraint
// This module's Kotlin sources can only consume dependencies whose metadata the project's
// Kotlin 1.8.0 compiler can read (1.8.0 is pinned repo-wide for Geoedge AppHarbr compatibility),
// so the two 2.x-metadata artifacts that reach this app's compile classpath are kept off it:
//  - play-services-ads is declared as "+" in the version catalog and drifts to releases built
//    with Kotlin 2.3, which also drag in a 2.x kotlin-stdlib. Pinned to the GMA version this
//    project was last verified against.
//  - databinding-ktx is added automatically by AGP because dataBinding is enabled; nothing here
//    uses its StateFlow bindings, and the generated bindings only need databinding-runtime.
configurations.all {
    resolutionStrategy {
        force "com.google.android.gms:play-services-ads:23.1.0"
    }
    exclude group: 'androidx.databinding', module: 'databinding-ktx'
}

dependencies {
    implementation project(':PrebidMobile')
    implementation project(':PrebidMobile-gamEventHandlers')
    implementation project(':PrebidMobile-admobAdapters')
    implementation project(':PrebidMobile-maxAdapters')

    // For testing staging releases
//    implementation "org.prebid:prebid-mobile-sdk:$sdkVersionName"
//    implementation "org.prebid:prebid-mobile-sdk-gam-event-handlers:$sdkVersionName"
//    implementation "org.prebid:prebid-mobile-sdk-admob-adapters:$sdkVersionName"
//    implementation "org.prebid:prebid-mobile-sdk-max-adapters:$sdkVersionName"

    // Base dependencies
    implementation libs.kotlin.stdlib
    implementation libs.androidx.annotation
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.vectordrawable.animated
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Ad dependencies
    implementation libs.google.play.services.base
    implementation libs.google.play.services.ads
    implementation libs.applovin.sdk
    implementation libs.google.play.services.ads.identifier // For Applovin Max


    // Navigation component
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Mock server
    implementation(libs.okhttp.mockwebserver) {
        exclude group: 'junit'
    }
    implementation libs.androidx.espresso.idling.resource

    // Helper
    implementation libs.gson
    implementation libs.glide
    implementation libs.androidx.multidex
    implementation libs.segmentedcontrol

    // Android tests
    androidTestImplementation libs.robotium.solo
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.espresso.intents
    androidTestImplementation libs.androidx.espresso.web
    androidTestImplementation libs.androidx.annotation
    androidTestImplementation libs.androidx.uiautomator

    // Video player
    implementation libs.exoplayer
    implementation libs.exoplayer.core
    implementation libs.exoplayer.ui
    implementation libs.extension.ima
}
