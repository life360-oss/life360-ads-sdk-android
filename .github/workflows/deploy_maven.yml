name: Publish to Maven Central

on:
  release:
    types: [published]
  # Re-runs a failed deploy without recreating the release. Dispatch from develop
  # so the latest workflow fixes apply; the sources still come from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.4.4
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g"
      GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # setup-java writes settings.xml that references these two by name:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up JDK 17 + Maven settings.xml
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
                <repositoryOrigins>
                  <repositoryOrigin>https://ossrh-staging-api.central.sonatype.com</repositoryOrigin>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle cache
        uses: gradle/gradle-build-action@v3

      - name: Import GPG key
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | tr -d ' \r\n' | base64 --decode | gpg --batch --import
          echo "default-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf || true
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Derive & verify version from tag
        run: |
          TAG="${RELEASE_TAG#v}"
          GRADLE_VER=$(grep -E 'sdkVersionName' build.gradle | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::Tag ($TAG) != build.gradle sdkVersionName ($GRADLE_VER)"
            exit 1
          fi
          echo "RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build, sign, and deploy to Central
        working-directory: scripts
        run: ./Maven/deployPrebidMobile-life.sh --version "$RELEASE_VERSION"
