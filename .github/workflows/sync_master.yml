name: Fast-forward main on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to fast-forward master to
        required: true

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fast-forward to release tag and push
        run: |
          git merge --ff-only ${{ github.event.inputs.tag || github.event.release.tag_name }}
          git push origin master
