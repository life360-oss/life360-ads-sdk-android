// Unlike the Java-only adapter modules, this one is Kotlin, so it needs the Kotlin plugin — without it
// AGP silently ignores every .kt file and publishes an empty artifact.
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../android.gradle'

android {
    namespace "com.life360.ads.appharbr"
    defaultConfig {
        // AppHarbr's AAR declares minSdkVersion 22, which is higher than the SDK core's 19.
        minSdkVersion 22
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
            systemProperty 'robolectric.invokedynamic.enable', 'false'
        }
    }
}

dependencies {
    implementation project(":PrebidMobile")
    implementation libs.kotlin.stdlib

    // compileOnly, so AppHarbr is neither packaged into our artifact nor placed on a consumer's runtime
    // classpath by us: consumers get it from the appharbr-android-sdk dependency this module's POM
    // declares (scripts/Maven/Life360AdsSDK-appHarbrAdapter-pom.xml), or from their own local drop.
    compileOnly "com.github.appharbr:appharbr-android-sdk:$appHarbrVersion"
    compileOnly "com.github.appharbr:appharbr-android-life360-adapter:$appHarbrAdapterVersion"
    testImplementation "com.github.appharbr:appharbr-android-sdk:$appHarbrVersion"

    testImplementation(project(":test-utils"))
    testImplementation(libs.bundles.test.libraries)
}
